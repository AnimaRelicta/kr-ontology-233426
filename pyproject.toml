[project]
name = "kr"
version = "0.1.0"
description = "КР: онтология и база знаний по исполнителям Rolling Stone 100 (Wikidata, SHACL, OWL RL)"
readme = "README.md"
authors = [
    { name = "AnimaRelicta", email = "anima.relicta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "owlrl>=7.6.2",
    "pandas>=3.1.0",
    "pyshacl>=0.40.2",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
]

[project.scripts]
kr = "kr:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
